# yangpu/A201 在线定位配置（基于 yangpu_qc，2026-06-09 采集）
common:
  dataset: "yangpu_a201"
  lidar_topic: "/lidar_preprocessor/meta_cloud"
  livox_lidar_topic: "/livox/lidar"
  imu_topic: "/ins_driver/imu"
  gnss_topic: "/ins_driver/gps"
  odom_topic: "/localization/ins"

# A201 首帧 INS 约 (308.4, -150.6)；与地图系接近，先关闭锚定，直接用 INS 初值
map_frame:
  enabled: false

# fasterlio 参数
fasterlio:
  lidar_type: 6
  scan_line: 16
  blind: 0.5
  time_scale: 1e-3

  skip_lidar_num: 0
  point_filter_num: 10
  max_iteration: 6
  filter_size_scan: 0.5
  filter_size_map: 0.5

  ivox_grid_resolution: 0.5
  ivox_nearby_type: 18
  esti_plane_threshold: 0.1

  use_aa: true

  kf_dis_th: 1.0
  kf_angle_th: 10.0
  min_effect_feat_surf: 80
  max_lidar_frame_trans_m: 0.8
  max_lidar_frame_rot_deg: 6.0
  max_lidar_velocity_mps: 8.0    # A201 港内 IGv 约 5~7 m/s，收紧速度门限
  max_ivox_grids: 12000
  ivox_capacity: 12000            # LRU 与 max_ivox_grids 对齐，溢出时重置局部图
  max_odom_translation_m: 25.0    # 定位模式 odom 漂移上限（map->odom 由 NDT 吸收全局位移）

  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_est_en: false
  extrinsic_T: [ 0, -0.15, 0 ]
  extrinsic_R: [ 1, 0, 0,
                 0, 1, 0,
                 0, 0, 1 ]
  keep_first_imu_estimation: false

g2p5:
  esti_floor: false
  lidar_height: 0.0
  floor_height: -1.2
  min_th_floor: 0.50
  max_th_floor: 1.0
  grid_map_resolution: 0.2

system:
  with_loop_closing: true
  with_ui: false  # 精度评测 headless；本地调试可改 true
  with_2dui: false
  with_g2p5: false
  step_on_kf: false

  enable_lidar_loc_skip: false
  enable_lidar_loc_rviz: false
  enable_lidar_odom_skip: false
  lidar_loc_skip_num: 4
  lidar_odom_skip_num: 2
  map_path: /home/glf/dataDisk/hainan/yangpu/map/chunked
  pub_tf: true

loop_closing:
  loop_kf_gap: 20
  min_id_interval: 20
  closest_id_th: 50
  max_range: 30.0
  ndt_score_th: 1.0
  with_height: false

lidar_loc:
  enable_dynamic_polygon: false
  enable_parking_static: true
  enable_icp_adjust: false
  filter_intensity_max: 255.0
  filter_intensity_min: 0.0
  filter_z_max: 30.0
  filter_z_min: -1.0
  force_2d: false
  grid_search_angle_range: 180.0
  grid_search_angle_step: 60
  lidar_loc_odom_th: 0.5
  init_with_fp: true
  min_init_confidence: 0.5
  max_init_yaw_diff_deg: 45.0
  external_pose_yaw_search_range: 30.0
  update_dynamic_cloud: true
  update_err_h: 0.2
  update_err_v: 0.2
  update_kf_dis: 2.0
  update_lidar_loc_score: 2.5
  loc_on_kf: true
  try_self_extrap: false
maps:
  delete_when_unload: false
  dyn_cloud_policy: persistent
  load_dyn_cloud: true
  load_map_size: 2
  max_pts_dyn_chunk: 100000
  save_dyn_when_quit: true
  save_dyn_when_unload: false
  unload_map_size: 4
  with_dyn_area: false
pgo:
  dr_ang_noise: 0.5
  dr_pos_noise: 1.0
  dr_pos_noise_ratio: 1.0
  lidar_loc_ang_noise: 1.0
  lidar_loc_outlier_th: 5.0
  lidar_loc_pos_noise: 0.3
  lidar_odom_ang_noise: 1.0
  lidar_odom_pos_noise: 0.3
  pgo_frame_converge_ang_th: 1.0
  pgo_frame_converge_pos_th: 0.05
  rtk_fix_ang_noise: 2.0
  rtk_fix_pos_noise: 1.0
  rtk_height_noise_ratio: 10.0
  rtk_other_ang_noise: 10.0
  rtk_other_pos_noise: 5.0
  rtk_outlier_th: 1.0
  smooth_factor: 0.01
roi:
  height_max: 0.5
  height_min: -2.0
  range_max: 70
  range_min: 3.0
ui:
  car_length: 2.0
  car_width: 1.6
  car_height: 1.7
  scans: 1
